<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10211a">
<meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kanzel">
<title>Kanzel · Order at your table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Readex+Pro:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--forest:#10211a;--panel:#162b21;--moss:#2f5233;--gold:#d3c994;--cream:#f4efdd;
 --serif:"Cormorant Garamond","Readex Pro",Georgia,serif;--sans:"Readex Pro",system-ui,sans-serif;
 color-scheme:dark;--sb:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:auto}
body{background:var(--forest);color:var(--cream);font-family:var(--sans);font-weight:300;min-height:100dvh;overflow-x:hidden;overflow-x:clip;padding-top:env(safe-area-inset-top,0px)}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--forest);z-index:10}
button,a{font:inherit;color:inherit;cursor:pointer;text-decoration:none}
button{background:none;border:0}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ===== The menu itself: the same CSS as the public menu (index.html), so both pages look identical ===== */
#menuView{--top:0px}
#menuView *,#menuView *::before,#menuView *::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
#menuView{background:var(--forest);min-height:100dvh}
#menuView button,#menuView a{font:inherit;color:inherit;cursor:pointer;text-decoration:none}
#menuView button{background:none;border:0}
#menuView .wrap{max-width:600px;margin:0 auto}
#menuView .bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0}
#menuView .rnd{width:40px;height:40px;border-radius:50%;border:1px solid rgba(211,201,148,.55);color:var(--gold);display:grid;place-items:center;background:rgba(16,33,26,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font:500 13px var(--sans);transition:background .25s,transform .25s}
#menuView .rnd:hover{background:rgba(211,201,148,.18)}#menuView .rnd:active{transform:scale(.94)}
#menuView #mlang svg{width:22px;height:22px;display:block}
#menuView .rnd svg{width:18px;height:18px}
#menuView [dir=rtl] .back svg,[dir=rtl] #menuView .back svg{transform:scaleX(-1)}
#menuView .bar img{height:44px;width:auto}
#menuView .mh{padding:8px 20px 4px}
#menuView .mh h1{font:600 30px/1.05 var(--serif)}
#menuView .mh p{font-size:13px;opacity:.9;margin-top:4px}
#menuView nav button{flex:none;height:60px;border-radius:16px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;overflow:hidden;border:1px solid rgba(211,201,148,.3);background:#ffffff0a;color:var(--cream);transition:height .25s,background .2s,border-color .2s}
#menuView nav button b{font:500 12.5px/1.1 var(--sans);white-space:nowrap}
#menuView .card{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:10px 12px;margin-bottom:8px;background:#ffffff0a;border-radius:18px}
#menuView .card.np{grid-template-columns:1fr;padding:12px 14px}
#menuView .card.np>div{display:grid;grid-template-columns:1fr auto;column-gap:14px;align-items:baseline}
#menuView .card.np p{grid-column:1/-1;grid-row:2}
#menuView .card.np .pr{grid-row:1;grid-column:2;margin:0}
#menuView .ph{position:relative;overflow:hidden;height:78px;border-radius:14px;border:1px solid #d3c99440;background:var(--ph,#2a4a2f)}
#menuView .card h3{font:600 17px/1.25 var(--serif)}
#menuView .card p{font:400 13px/1.5 var(--sans);color:#e6e0cb;opacity:1;margin:3px 0 0}
#menuView .card p:empty{display:none}
#menuView .card .pr{display:block;margin-top:6px;padding:0;border:0;background:none;font:700 16px/1.2 var(--sans);color:#e8d98a;white-space:nowrap}
#menuView .card .pr small{font:500 12px var(--sans);opacity:.9;margin-inline-start:3px}
#menuView nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;overflow:visible;padding:10px 16px;background:#10211af5;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);scrollbar-width:none}
#menuView nav button.on{border-color:var(--gold);background:rgba(211,201,148,.16);box-shadow:inset 0 0 0 1px var(--gold)}
#menuView section{padding:8px 16px 0;scroll-margin-top:84px}
#menuView h2{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--stkh,128px));z-index:4;margin:0;padding:5px 0;background:var(--forest);font:inherit}
#menuView .acch{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;gap:12px;width:100%;height:64px;padding:0 14px;text-align:start;border:1px solid rgba(211,201,148,.32);border-radius:16px;background:#1b3a2a;transition:height .28s ease}
#menuView .acch .nm{flex:1;font:italic 600 24px/1.15 var(--serif);color:var(--gold);text-shadow:0 1px 8px rgba(0,0,0,.65)}
#menuView .acch small{font-size:13px;opacity:.88}
#menuView .acch .chev{flex:none;width:10px;height:10px;margin-inline:4px;border:solid var(--gold);border-width:0 1.5px 1.5px 0;transform:rotate(45deg) translate(-2px,-2px);transition:transform .3s}
#menuView section.open .chev{transform:rotate(-135deg) translate(-2px,-2px)}
#menuView .items{padding-top:12px}
#menuView section:not(.open) .items{display:none}
#menuView section.open .items{animation:fade .35s both}
#menuView .totop{position:fixed;inset-inline-end:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;width:48px;height:48px;border-radius:50%;border:1px solid var(--gold);background:#10211af2;color:var(--gold);display:grid;place-items:center;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#menuView .totop.on{opacity:1;transform:none;pointer-events:auto}
#menuView .totop svg{width:20px;height:20px}
[dir=rtl] #menuView .acch .nm,[dir=rtl] #menuView nav button b{font-style:normal}
#menuView .tax{font-size:13px;opacity:.85;text-align:center;padding:28px 20px calc(60px + env(safe-area-inset-bottom,0px))}
body.is-menu #menuView{display:block}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
#menuView .mh h1::after{content:"";display:block;height:1.5px;width:56px;background:var(--gold);margin-top:10px;transform-origin:left}
[dir=rtl] #menuView .mh h1::after{transform-origin:right}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes chip{from{opacity:0;transform:translateX(calc(34px*var(--dx,1))) scale(.9)}to{opacity:1;transform:none}}
@keyframes line{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
[dir=rtl] #menuView{--dx:-1}
.emptyM{padding:48px 24px;text-align:center;color:var(--cream)}
#menuView nav button .ti{display:block;line-height:0}
#menuView.min nav button{height:42px;flex-direction:row;gap:7px}
#menuView section{scroll-margin-top:calc(env(safe-area-inset-top,0px) + var(--stkh,128px))!important}
#menuView section.gh{display:none}
body.searching #menuView section.gh{display:block}
#menuView section.open .acch{height:52px}
#menuView .bn{position:absolute;inset:0;z-index:-2;background:var(--ph,#2a4a2f)}
#menuView .bn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;filter:blur(12px);transform:scale(1.1);transition:opacity .6s,filter .7s,transform .7s}
#menuView .bn img.ok{opacity:.65;filter:none;transform:none}
#menuView .bn::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(16,33,26,.95) 10%,rgba(16,33,26,.55) 70%,rgba(16,33,26,.28))}
[dir=rtl] #menuView .bn::after{background:linear-gradient(270deg,rgba(16,33,26,.95) 10%,rgba(16,33,26,.55) 70%,rgba(16,33,26,.28))}
#menuView .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;filter:blur(10px);transform:scale(1.08);transition:opacity .5s,filter .6s,transform .6s}
#menuView .ph img.ok{opacity:1;filter:none;transform:none}
#menuView .items.g{padding-top:12px}
#menuView section.open .items.g,body.searching #menuView .items.g{display:grid!important;grid-template-columns:1fr 1fr;gap:10px}
#menuView .items.g .card{margin:0}
#menuView .items.g .card.np{grid-column:1/-1}
#menuView .card.gc{display:block;padding:0;overflow:hidden}
#menuView .gc .ph{height:auto;aspect-ratio:1/1;border:0;border-radius:0}
#menuView .gc>div:last-child{padding:10px 12px 12px}
#menuView .gc h3{font-size:15.5px}
#menuView .gc p{font-size:12px;line-height:1.45}
#menuView .card.rv{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .55s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*60ms)}
#menuView .card.rv.in,body.searching #menuView .card.rv{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){#menuView .card.rv{opacity:1;transform:none;transition:none}#menuView .ph img,#menuView .bn img{transition:none;filter:none;transform:none}}
#menuView .ci{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--gold);border:1px solid rgba(211,201,148,.55);background:rgba(16,33,26,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:width .28s,height .28s,background .3s,color .3s,border-color .3s}
#menuView .ci svg{width:23px;height:23px;display:block;overflow:visible;transition:transform .35s}
#menuView section.open .ci{width:34px;height:34px;background:var(--gold);color:var(--forest);border-color:var(--gold);animation:kzpop .55s cubic-bezier(.3,1.5,.5,1)}
#menuView section.open .ci svg{width:20px;height:20px}
#menuView .acch{box-shadow:0 8px 20px -12px rgba(0,0,0,.7);transition:height .28s ease,transform .15s}
#menuView .acch:active{transform:scale(.985)}
#menuView .acch small{padding:2px 9px;border-radius:99px;background:rgba(16,33,26,.6);border:1px solid rgba(211,201,148,.35);font:500 12px var(--sans)}
#menuView section.open .bn img.ok{animation:kzk 10s ease-out both}
#menuView nav button .ti svg{width:24px;height:24px;overflow:visible;color:var(--gold);transition:color .2s}
#menuView.min nav button .ti svg{width:18px;height:18px}
#menuView nav button.on{box-shadow:inset 0 0 0 1px var(--gold),0 6px 18px -8px rgba(211,201,148,.55)}
#menuView nav button.on .ti{animation:kzpop .5s cubic-bezier(.3,1.5,.5,1)}
#menuView nav button:active{transform:scale(.96)}
#menuView svg .an{transform-box:fill-box;transform-origin:50% 50%;animation-duration:2.4s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-play-state:paused}
#menuView section.open .ci svg .an,#menuView nav button.on svg .an,#menuView .acch:hover svg .an{animation-play-state:running}
#menuView svg .s{animation-name:kzs}#menuView svg .f{animation-name:kzf;animation-duration:1.1s;animation-direction:alternate;transform-origin:50% 100%}
#menuView svg .r{animation-name:kzr;animation-duration:1.8s}#menuView svg .tw{animation-name:kztw;animation-duration:1.6s}
#menuView svg .sp{animation-name:kzsp2;animation-duration:12s;animation-timing-function:linear}
#menuView svg .b{animation-name:kzb;animation-duration:2s}#menuView svg .lid{animation-name:kzl;animation-duration:1.6s;animation-direction:alternate}
#menuView svg .wv{animation-name:kzw;animation-duration:1.4s;animation-direction:alternate}#menuView svg .cu{animation-name:kzc;animation-duration:1.8s;animation-direction:alternate}
@keyframes kzs{0%{transform:translateY(1px);opacity:.2}50%{opacity:1}100%{transform:translateY(-2px);opacity:.1}}
@keyframes kzf{from{transform:scale(1,1)}to{transform:scale(.94,1.1)}}
@keyframes kzr{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes kztw{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.15);opacity:1}}
@keyframes kzsp2{to{transform:rotate(360deg)}}
@keyframes kzb{0%{transform:translateY(1.5px);opacity:.3}60%{opacity:1}100%{transform:translateY(-2px);opacity:0}}
@keyframes kzl{from{transform:translateY(0)}to{transform:translateY(-2px)}}
@keyframes kzw{from{transform:translateX(-1.2px)}to{transform:translateX(1.2px)}}
@keyframes kzc{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-1.5px) rotate(8deg)}}
@keyframes kzpop{0%{transform:scale(.6) rotate(-14deg)}100%{transform:none}}
@keyframes kzk{from{transform:scale(1.14)}to{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){#menuView svg .an,#menuView section.open .bn img.ok,#menuView section.open .ci,#menuView nav button.on .ti{animation:none!important}}
#menuView .acch{height:96px;gap:12px;padding:0 14px;border-radius:22px;background:linear-gradient(100deg,rgba(16,33,26,.95) 38%,rgba(16,33,26,.7)),var(--ph,#1b3a2a);box-shadow:0 10px 24px -14px rgba(0,0,0,.85)}
#menuView section.open .acch{height:60px;border-radius:18px}
#menuView .tx{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:5px}
#menuView .acch .tx small{order:-1;padding:0;border:0;border-radius:0;background:none;font:500 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);opacity:.85}
[dir=rtl] #menuView .acch .tx small{letter-spacing:0;text-transform:none;font-size:12px}
#menuView .acch .tx .nm{flex:none;font:italic 600 26px/1.08 var(--serif);color:var(--cream);text-shadow:0 1px 10px rgba(0,0,0,.5)}
#menuView section.open .tx{flex-direction:row;align-items:center;gap:10px}
#menuView section.open .acch .tx small{order:1}
#menuView section.open .acch .tx .nm{font-size:22px;color:var(--gold)}
#menuView .plt{position:relative;flex:none;width:76px;height:76px;border-radius:50%;overflow:hidden;border:2px solid rgba(211,201,148,.75);background:var(--ph,#2a4a2f);box-shadow:0 8px 18px -6px rgba(0,0,0,.75),0 0 0 4px rgba(211,201,148,.12);transition:width .28s,height .28s,box-shadow .28s}
#menuView .plt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;filter:blur(10px);transform:scale(1.1);transition:opacity .5s,filter .6s,transform .6s}
#menuView .plt img.ok{opacity:1;filter:none;transform:none}
#menuView section.open .plt{width:40px;height:40px;border-width:1.5px;box-shadow:none}
#menuView .acch .chev{position:absolute;inset-inline-end:10px;bottom:7px;margin:0;width:24px;height:24px;border:0;border-radius:50%;background:var(--gold);transform:none;box-shadow:0 2px 8px rgba(0,0,0,.5);transition:all .3s}
#menuView .acch .chev::before{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border:solid var(--forest);border-width:0 2px 2px 0;transform:translate(-50%,-72%) rotate(45deg);transition:transform .3s}
#menuView section.open .acch .chev{transform:none;width:19px;height:19px;bottom:6px;inset-inline-end:7px}
#menuView section.open .acch .chev::before{transform:translate(-50%,-30%) rotate(-135deg)}
#menuView .acch.nopl .chev{bottom:auto;top:50%;margin-top:-12px}
#menuView section.open .acch.nopl .chev{margin-top:-10px}
#menuView .card.gc{border-radius:20px;border:1px solid rgba(211,201,148,.18)}
#menuView .gc .ph .pr{position:absolute;z-index:2;inset-inline-end:8px;bottom:8px;margin:0;padding:6px 10px;border-radius:99px;background:rgba(16,33,26,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(211,201,148,.4);font:700 14px/1 var(--sans);color:#e8d98a}
#menuView .gc .ph .pr small{font-size:10.5px}
@media(prefers-reduced-motion:reduce){#menuView .plt img{transition:none;filter:none;transform:none}}
#menuView .mbody{display:grid;grid-template-columns:76px 1fr;align-items:start;padding-inline-start:14px;margin-top:6px}
#menuView .mbody.norail{grid-template-columns:1fr;padding-inline-start:0}.mbody.norail #mrail{display:none}
body.searching #menuView .mbody{grid-template-columns:1fr;padding-inline-start:0}body.searching #menuView #mrail{display:none}
#menuView #mrail{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--stkh,128px) + 8px);max-height:calc(100dvh - var(--stkh,128px) - 80px);overflow-y:auto;scrollbar-width:none;padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:14px;background:rgba(8,16,12,.6);border:1px solid rgba(211,201,148,.22);border-radius:26px}
#menuView #mrail::-webkit-scrollbar{display:none}
#menuView #mrail{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 var(--mt,0px),#000 calc(100% - var(--mb,0px)),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 var(--mt,0px),#000 calc(100% - var(--mb,0px)),transparent 100%)}
#menuView #mrail.up{--mt:38px}#menuView #mrail.dn{--mb:38px}
#menuView .av{flex:none;width:68px;padding:0;border:0;background:none;color:#b9b393;font:500 10px/1.25 var(--sans);text-align:center;cursor:pointer}
#menuView .av[hidden]{display:none}
#menuView .av span{position:relative;display:grid;place-items:center;width:46px;height:46px;margin:0 auto 5px;border-radius:50%;overflow:hidden;border:2px solid transparent;background:var(--ph,#1b3a2a);color:var(--gold);opacity:.72;transition:opacity .25s,transform .3s,border-color .25s,box-shadow .25s}
#menuView .av span svg{width:22px;height:22px}
#menuView .av span img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;filter:blur(8px);transition:opacity .5s,filter .6s}#menuView .av span img.ok{opacity:1;filter:none}
#menuView .av b{display:block;font-weight:500}
#menuView .av.on{color:var(--gold)}#menuView .av.on span{opacity:1;border-color:var(--gold);transform:scale(1.07);box-shadow:0 0 0 4px rgba(211,201,148,.16)}
#menuView #mlist section{padding:2px 16px 0 14px;display:none}
#menuView #mlist section.open,body.searching #menuView #mlist section{display:block}
#menuView h2.sh{position:static;display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:4px 2px 14px;background:none}
#menuView h2.sh .nm{font:italic 600 34px/1.05 var(--serif);color:var(--gold)}
#menuView h2.sh small{font:500 10.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;opacity:.7}
[dir=rtl] #menuView h2.sh small{letter-spacing:0;text-transform:none;font-size:12px}
#menuView .card{grid-template-columns:84px 1fr;gap:12px;padding:0 0 14px;margin-bottom:14px;background:none;border-radius:0;border-bottom:1px solid rgba(211,201,148,.16)}
#menuView .card .ph{width:84px;height:84px;border:0;border-radius:18px}
#menuView .card h3{font:600 17px/1.2 var(--serif);color:var(--cream)}
#menuView .card p{font-size:12px;line-height:1.4;opacity:.72;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#menuView .card .pr{margin-top:5px;font-size:14.5px}
#menuView .card.np{grid-template-columns:1fr;padding:0 0 14px}
#menuView .items .card:last-child{border-bottom:0}
#menuView{display:block}

/* language pill (same as the public menu) */
.lang{width:auto!important;min-width:40px;padding:0 13px!important;border-radius:99px!important;display:inline-flex!important;align-items:center;gap:7px}
.lang .lt{font:500 12.5px/1 var(--sans);letter-spacing:.08em}
.lang svg{width:19px!important;height:19px!important}
.spin{animation:spin .8s cubic-bezier(.5,0,.2,1)}

/* ===== Only what is different on the table page ===== */
#menuView .bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
#menuView .bar>:first-child{justify-self:start}#menuView .bar>:last-child{justify-self:end}
.tbl{min-width:40px;height:40px;padding:0 15px;border-radius:99px;border:1px solid rgba(211,201,148,.55);color:var(--gold);display:inline-grid;place-items:center;font:500 13px var(--sans);white-space:nowrap;background:rgba(16,33,26,.35)}
#menuView .card .cx{min-width:0}
#menuView .card .prow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;min-height:38px}
#menuView .card .prow .pr{margin:0}
#menuView .card.np>.cx{display:block}
#menuView .card.np .prow .pr{grid-row:auto;grid-column:auto}
#menuView .tax{padding-bottom:calc(110px + var(--sb))}
body.cart #menuView .totop{bottom:calc(92px + var(--sb))}
body.cart #menuView #mrail{max-height:calc(100dvh - var(--stkh,128px) - 170px)}

/* the menu CSS above resets padding/borders with an id selector, so these need the same weight */
#menuView .tbl{padding:0 15px;color:var(--gold)}
#menuView .q{border:1px solid rgba(211,201,148,.6);color:var(--gold)}
#menuView .q.fill{background:var(--gold);color:var(--forest)}
#menuView .n{min-width:28px}
#menuView .banner{margin:10px 16px 0;padding:12px 16px;border:1px solid rgba(211,201,148,.45);color:var(--cream)}
#menuView .svc{padding:10px 16px 2px}
#menuView .svc button,#menuView .svc input{padding:10px 10px;border:1px solid rgba(211,201,148,.55);color:var(--gold)}
#menuView .svc input{color:var(--cream)}
#menuView .svc button.on{color:#8fd19e;border-color:rgba(143,209,158,.5)}
#menuView .totop{border:1px solid var(--gold)}

.ctl{display:flex;align-items:center;gap:2px;direction:ltr}
.q{width:38px;height:38px;border-radius:50%;border:1px solid rgba(211,201,148,.6);color:var(--gold);display:grid;place-items:center;font:400 22px/1 var(--sans);transition:background .2s,transform .15s}
.q:hover{background:rgba(211,201,148,.18)}.q:active{transform:scale(.9)}
.q.fill{background:var(--gold);color:var(--forest)}
.n{min-width:28px;text-align:center;font:500 16px var(--sans)}

.rnd{width:40px;height:40px;border-radius:50%;border:1px solid rgba(211,201,148,.55);color:var(--gold);display:grid;place-items:center;background:rgba(16,33,26,.35);transition:background .25s,transform .25s}
.rnd:hover{background:rgba(211,201,148,.18)}.rnd:active{transform:scale(.94)}
.rnd svg{width:22px;height:22px;display:block}

.banner{margin:10px 16px 0;padding:12px 16px;border-radius:16px;border:1px solid rgba(211,201,148,.45);background:#d3c9941a;display:flex;align-items:center;gap:10px;width:calc(100% - 32px);text-align:start;font-size:13px}
.banner[hidden]{display:none}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--gold);animation:pulse 1.4s infinite}
.dot.ok{background:#8fd19e;animation:none}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.svc{display:flex;gap:8px;padding:10px 16px 2px}
.svc button,.svc input{flex:1;min-width:0;padding:10px 10px;border-radius:99px;border:1px solid rgba(211,201,148,.55);color:var(--gold);font:400 13px var(--sans);background:none;text-align:center}
.svc input{color:var(--cream);background:#ffffff0d;font-size:16px}.svc input::placeholder{color:rgba(244,239,221,.88)}
.svc button.on{background:rgba(143,209,158,.15);color:#8fd19e;border-color:rgba(143,209,158,.5)}

.cartbar{position:fixed;inset-inline:0;bottom:0;z-index:8;padding:12px 16px calc(12px + var(--sb));background:linear-gradient(180deg,transparent,rgba(16,33,26,.92) 40%);transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.cartbar.on{transform:none}
.cartbar button{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;max-width:568px;margin:0 auto;padding:15px 22px;border-radius:99px;background:var(--gold);color:var(--forest);font:500 15px var(--sans);box-shadow:0 8px 30px rgba(0,0,0,.45)}
.cartbar .cnt{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 8px;border-radius:99px;background:var(--forest);color:var(--gold);font-size:13px;margin-inline-end:10px}
.cartbar button:active{transform:scale(.98)}

.sheet{position:fixed;inset:0;z-index:20;visibility:hidden}
.sheet.on{visibility:visible}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .3s}
.sheet.on .bd{opacity:1}
.sheet .pn{position:absolute;inset-inline:0;bottom:0;max-width:600px;margin:0 auto;max-height:90dvh;overflow:auto;background:var(--panel);border-top:1px solid rgba(211,201,148,.5);border-radius:28px 28px 0 0;padding:18px 20px calc(20px + var(--sb));transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.7,.2,1)}
.sheet.on .pn{transform:none}
.shh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.shh h2{margin:0;font:italic 600 30px var(--serif);color:var(--gold)}
[dir=rtl] .shh h2{font-style:normal}
.shh .rnd{width:36px;height:36px}.shh .rnd svg{width:16px;height:16px}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid rgba(211,201,148,.2)}
.li:first-of-type{border-top:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font:500 15px/1.3 var(--sans)}
.li .t span{font-size:12.5px;color:var(--gold)}
.li .q{width:34px;height:34px;font-size:20px}
.fld{display:block;margin-top:14px}
.fld span{display:block;font-size:13px;opacity:.9;margin-bottom:6px}
.fld textarea,.fld input{width:100%;font:inherit;font-size:16px;color:var(--cream);background:#ffffff0d;border:1px solid rgba(211,201,148,.35);border-radius:14px;padding:12px 14px;resize:none}
.fld.err input{border-color:#e58f8f}
.sum{margin-top:18px;padding-top:12px;border-top:1px solid rgba(211,201,148,.45)}
.sum .sr{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:14px;color:rgba(244,239,221,.8)}
.sum .sr i{font-style:normal;white-space:nowrap}
.sum .gt{margin-top:6px;padding-top:10px;border-top:1px solid rgba(211,201,148,.25);align-items:baseline;color:var(--cream);font-size:16px}
.sum .gt b{font:600 26px var(--serif);color:var(--gold)}
.send{display:block;width:100%;margin-top:16px;padding:16px;border-radius:99px;background:var(--gold);color:var(--forest);font:500 16px var(--sans);transition:opacity .2s,transform .15s}
.send:active{transform:scale(.98)}.send:disabled{opacity:.5;cursor:default}
.empty{padding:30px 0;text-align:center;opacity:.85;font-size:14px}

.done{position:fixed;inset:0;z-index:30;background:var(--forest);display:none;overflow:auto;padding:calc(28px + env(safe-area-inset-top,0px)) 24px calc(28px + var(--sb))}
.done.on{display:block;animation:fade .4s both}
.done .in{max-width:520px;margin:0 auto;text-align:center}
.ring{width:84px;height:84px;margin:30px auto 18px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;color:var(--gold)}
.ring svg{width:38px;height:38px}
.done h1{font:600 36px/1.1 var(--serif)}
.done .st{display:inline-flex;align-items:center;gap:10px;margin:14px 0 4px;padding:10px 16px;border-radius:99px;border:1px solid rgba(211,201,148,.45);background:#d3c9941a;font-size:14px}
.done .meta{font-size:13px;opacity:.85;margin-top:8px}
.rcpt{margin:26px 0 0;text-align:start;padding:6px 18px;border-radius:22px 8px 22px 22px;background:#ffffff0a}
.rcpt .r{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid rgba(211,201,148,.18);font-size:14px}
.rcpt .r:first-child{border-top:0}
.rcpt .r i{font-style:normal;color:var(--gold);white-space:nowrap}
.rcpt .nt{padding:10px 0;font-size:14px;opacity:.92;border-top:1px solid rgba(211,201,148,.18)}
.rcpt .tt{font-weight:500}
.done .back{display:block;width:100%;margin-top:22px;padding:15px;border-radius:99px;border:1px solid var(--gold);color:var(--gold);font:500 15px var(--sans)}
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translate(-50%,-30px);opacity:0;pointer-events:none;background:var(--cream);color:var(--forest);padding:12px 20px;border-radius:12px;font-size:14px;max-width:88vw;text-align:center;transition:.3s;z-index:40}
.toast.on{opacity:1;transform:translate(-50%,0)}
.steps{display:flex;gap:6px;margin:18px 0 6px;width:100%}.steps div{flex:1;text-align:center;font-size:12px;color:rgba(244,239,221,.85)}
.steps div::before{content:"";display:block;height:4px;border-radius:99px;background:rgba(244,239,221,.18);margin-bottom:7px}
.steps div.on{color:var(--gold)}.steps div.on::before{background:var(--gold)}
.rateC{margin:18px 0 4px;padding:16px;border-radius:22px;background:rgba(211,201,148,.1);border:1px solid rgba(211,201,148,.4);text-align:center;width:100%}
.rateC h3{font:600 24px var(--serif)}.rateC p{font-size:13px;margin:6px 0 12px;color:rgba(244,239,221,.8)}
.rb{display:inline-block;padding:12px 22px;border-radius:99px;background:var(--gold);color:var(--forest);font:500 14px var(--sans)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>

   Order = {id, table, items:[{id,en,ar,price,qty}], note, total, status:"new"|"confirmed", ts, confirmedAt?} */

 KEY:"kanzel-orders",
 all(){try{return JSON.parse(localStorage.getItem(this.KEY)||"[]")}catch(e){return []}},
 save(a){try{localStorage.setItem(this.KEY,JSON.stringify(a));return true}catch(e){return false}},
 send(o){const a=this.all();a.push(o);return this.save(a)},
 get(id){return this.all().find(o=>o.id===id)||null}
};

 $("#dst").parentElement.style.display=k===0?"":"none";
 const rc=$("#rateC");rc.hidden=k<3;if(k>=3){$("#rateT").textContent=t.rateT;$("#rateP").textContent=t.rateP;$("#rateB").textContent=t.rateB;$("#rateB").href=KZ.settings().mapsUrl}}
function showDone(){$("#done").classList.add("on");document.body.classList.add("lock");paintDone();scrollTo(0,0);startPoll()}
function hideDone(){$("#done").classList.remove("on");document.body.classList.remove("lock");paintBanner()}
$("#dback").onclick=hideDone;
$("#banner").onclick=()=>{if(cur())showDone()};
function paintBanner(){const o=cur(),b=$("#banner");
 /* hide stale orders after 3 hours */
 if(!o||Date.now()-o.ts>3*3600e3){b.hidden=true;return}
 const k=sIdx(o),t=tr();b.hidden=false;$("#bdot").classList.toggle("ok",k>0);$("#btxt").textContent=[t.ban,t.banOk,t.banReady,t.banServed][k]}
/* the waiter page flips the status; we pick it up from storage events or a light poll */
function startPoll(){clearInterval(poll);poll=setInterval(()=>{const o=cur();if(!o){clearInterval(poll);return}
 if($("#done").classList.contains("on"))paintDone();paintBanner();if(o.status==="served")clearInterval(poll)},2000)}
addEventListener("storage",e=>{if(e.key===Orders.KEY){paintBanner();if($("#done").classList.contains("on"))paintDone()}});

render();
if(cur()&&cur().status!=="served")startPoll();

/* ---------- call waiter / bill ---------- */
function callsFor(tb){return KZ.list("calls").filter(c=>String(c.table)===String(tb)&&!c.done)}
function paintSvc(){const t=tr(),cs=table?callsFor(table):[],w=cs.some(c=>c.type==="waiter"),bl=cs.some(c=>c.type==="bill");
 $("#svcT").hidden=!!table;$("#svcT").placeholder=t.askT;
 $("#callW").textContent=w?t.reqW:t.callW;$("#callW").classList.toggle("on",w);
 $("#callB").textContent=bl?t.reqB:t.callB;$("#callB").classList.toggle("on",bl)}
function callStaff(type){const t=tr();let tb=table||$("#svcT").value.trim().replace(/[^\w؀-ۿ -]/g,"").trim().slice(0,14);
 if(!tb){$("#svcT").hidden=false;$("#svcT").focus();toast(t.needT);return}
 if(callsFor(tb).some(c=>c.type===type)){toast(type==="bill"?t.reqB:t.reqW);return}
 if(!KZ.push("calls",{id:KZ.uid(),table:tb,type,ts:Date.now(),done:false})){KZ.toast(t.fail,1);return}
 if(!table){table=tb;$("#tbl").textContent=`${t.table} ${table}`}
 toast(type==="bill"?t.reqB:t.reqW);paintSvc()}
$("#callW").onclick=()=>callStaff("waiter");$("#callB").onclick=()=>callStaff("bill");
addEventListener("storage",e=>{if(e.key===KZ.KEYS.calls)paintSvc()});
setInterval(()=>{paintSvc();paintBanner();if($("#done").classList.contains("on"))paintDone()},2500);
paintSvc();
</script>
