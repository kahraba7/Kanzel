<html lang="en" dir="ltr">
<head>

<style>
/* ===== Owner dashboard (v44) ===== */
:root{--line:rgba(211,201,148,.2);--line2:rgba(211,201,148,.38);--mut:rgba(244,239,221,.72);--card:#ffffff0a}
.wrap{max-width:1040px}
.bar,.mh{max-width:1040px;margin:0 auto}
.mh h1{font-size:clamp(34px,9vw,46px)}
.mh p{font-size:14px;color:var(--mut)}
.mh .dt{display:block;margin-top:2px;font-size:12.5px;opacity:.8}

/* main navigation: sticky segmented control with icons */
.anav{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin-top:14px;padding:10px 16px;background:rgba(16,33,26,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
.anav.stuck{border-bottom-color:var(--line)}
.anav .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:99px;background:#ffffff0d;border:1px solid var(--line)}
.anav button{display:flex;align-items:center;justify-content:center;gap:8px;height:42px;border-radius:99px;font-size:14px;color:var(--mut);transition:background .2s,color .2s}
.anav button svg{width:18px;height:18px;flex:none}@media(max-width:560px){.anav button{flex-direction:column;gap:2px;height:52px;font-size:11.5px}.anav .in{border-radius:26px}}
.anav button.on{background:var(--gold);color:var(--forest);font-weight:500}
.page{max-width:680px;margin:0 auto}
.page.wide{max-width:1040px}

/* range chips */
.chips{display:flex;gap:6px;padding:16px 16px 0;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:99px;border:1px solid var(--line2);font-size:13px;color:var(--mut);transition:background .2s}
.chip.on{background:#d3c9942b;color:var(--gold);border-color:var(--gold)}
.sp{flex:1}

/* hero: sales */
.hero2{position:relative;margin:14px 16px 0;padding:20px 20px 16px;border-radius:30px 10px 30px 30px;border:1px solid var(--line2);background:radial-gradient(120% 140% at 0% 0%,rgba(211,201,148,.2),rgba(211,201,148,.04) 55%,transparent),#ffffff08;overflow:hidden}
.hero2 .k{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
[dir=rtl] .hero2 .k{letter-spacing:0;font-size:13px;text-transform:none}
.hero2 .big{display:flex;align-items:baseline;gap:8px;margin-top:8px;font:500 clamp(44px,13vw,64px)/1 var(--serif);color:var(--cream);font-variant-numeric:lining-nums}
.hero2 .big small{font:400 14px var(--sans);color:var(--mut);letter-spacing:.06em}
.hero2 .sub2{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--mut)}
.dl{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font:500 12.5px var(--sans);background:#ffffff12;color:var(--mut)}
.dl.up{background:rgba(143,209,158,.16);color:var(--ok)}.dl.dn{background:rgba(229,154,143,.16);color:var(--bad)}
.dl svg{width:11px;height:11px}
.spark{display:flex;align-items:flex-end;gap:3px;height:92px;margin-top:18px;direction:ltr}
.spark i{flex:1;min-width:2px;border-radius:5px 5px 2px 2px;background:rgba(211,201,148,.34);transition:background .2s,height .5s cubic-bezier(.2,.7,.2,1)}
.spark i.pk{background:var(--gold)}
.spark i.z{background:rgba(211,201,148,.12)}
.spark i.now{box-shadow:0 0 0 1.5px var(--gold) inset}
.sax{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--mut);direction:ltr}
.hero2 .empty-s{margin-top:14px;font-size:13px;color:var(--mut)}

/* live strip */
.live{margin:12px 16px 0;padding:12px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.live .lt{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
[dir=rtl] .live .lt{letter-spacing:0;font-size:13px;text-transform:none}
.live .lv{display:flex;align-items:center;gap:7px;font-size:13.5px}
.live .lv b{font:500 18px var(--serif);color:var(--gold)}
.live .pd{width:8px;height:8px;border-radius:50%;background:rgba(244,239,221,.3)}
.live .pd.on{background:var(--ok);animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.3;transform:scale(.7)}}
.live a{margin-inline-start:auto;font-size:12.5px;color:var(--gold);border-bottom:1px solid var(--line2);padding-bottom:1px}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px 16px 0}
.kpi{position:relative;padding:14px 14px 13px;border-radius:22px 8px 22px 22px;border:1px solid var(--line);background:var(--card)}
.kpi .ic{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#d3c9941f;color:var(--gold)}
.kpi .ic svg{width:17px;height:17px}
.kpi b{display:block;margin-top:10px;font:500 30px/1 var(--serif);color:var(--cream)}
.kpi span{display:block;margin-top:4px;font-size:12.5px;color:var(--mut)}
.kpi .dl{position:absolute;top:12px;inset-inline-end:12px;padding:2px 8px;font-size:11.5px}

/* panels */
.grid2{display:grid;grid-template-columns:1fr;gap:0;align-items:start}
.pnl{margin:12px 16px 0;padding:16px 16px 14px;border-radius:24px;border:1px solid var(--line);background:var(--card)}
.pnl h2{display:flex;align-items:center;justify-content:space-between;gap:10px;font:500 24px/1.1 var(--serif);margin-bottom:12px}
.pnl h2 small{font:400 12px var(--sans);color:var(--mut)}
.pnl .hint{margin-top:10px;font-size:12.5px;color:var(--mut)}
.pnl .none{padding:14px 4px;text-align:center;font-size:13px;color:var(--mut)}
.rk{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.rk:first-of-type{border-top:0;padding-top:2px}
.rk .n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#ffffff10;font:500 11.5px var(--sans);color:var(--mut)}
.rk:nth-of-type(-n+3) .n{background:var(--gold);color:var(--forest)}
.rk .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .v{font:500 13.5px var(--sans);color:var(--gold);text-align:end;white-space:nowrap}
.rk .tr{grid-column:2/-1;height:5px;border-radius:99px;background:#ffffff12;overflow:hidden}
.rk .tr i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,rgba(211,201,148,.55),var(--gold))}
.rk .sv{grid-column:2/-1;font-size:11.5px;color:var(--mut);margin-top:-2px}

/* stacked share bar */
.share{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;direction:ltr}
.share i{display:block;height:100%}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:14px}
.leg div{display:flex;align-items:center;gap:8px;font-size:12.5px;min-width:0}
.leg i{flex:none;width:9px;height:9px;border-radius:3px}
.leg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.leg b{font-weight:500;color:var(--gold)}

/* hour + weekday charts */
.cols{display:flex;align-items:flex-end;gap:3px;height:110px;direction:ltr}
.cols>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.cols i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:rgba(211,201,148,.34);min-height:3px}
.cols .pk i{background:var(--gold)}.cols .z i{background:rgba(211,201,148,.12)}
.cols span{margin-top:6px;font-size:10px;color:var(--mut);height:13px;white-space:nowrap}
.cols.wk{gap:8px}.cols.wk span{font-size:11.5px}
.callout{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 12px;border-radius:14px;background:#d3c9941a;font-size:13px}
.callout svg{width:18px;height:18px;color:var(--gold);flex:none}
.callout b{color:var(--gold);font-weight:500}

/* highlights */
.hl{display:grid;gap:10px}
.hl div{display:flex;align-items:center;gap:12px;font-size:13.5px}
.hl .ic{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#d3c9941f;color:var(--gold)}
.hl .ic svg{width:17px;height:17px}
.hl small{display:block;font-size:11.5px;color:var(--mut)}

/* service speed */
.spd{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spd>div{padding:12px;border-radius:16px;background:#ffffff08;border:1px solid var(--line)}
.spd b{display:block;font:500 28px/1 var(--serif);color:var(--cream)}
.spd b small{font:400 12px var(--sans);color:var(--mut);margin-inline-start:4px}
.spd span{display:block;margin-top:6px;font-size:12px;color:var(--mut)}

.foot2{margin:18px 22px 0;font-size:12.5px;color:var(--mut);line-height:1.7;text-align:center}

/* menu editor */
.mstat{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px 0}
.mstat .pill{background:#ffffff08}
.msearch{position:relative;margin:12px 16px 0}
.msearch svg{position:absolute;top:50%;inset-inline-start:14px;width:18px;height:18px;transform:translateY(-50%);color:var(--gold);pointer-events:none}
.msearch input{padding-inline-start:42px;border-radius:99px;font-size:16px}
.cat{margin:10px 16px 0}
.cat>summary{padding:14px 16px;font:500 22px var(--serif)}
.cat>summary .r{display:flex;align-items:center;gap:8px}
.cat>summary .chv,.dtop .chv{flex:none;width:8px;height:8px;border:solid var(--gold);border-width:0 1.5px 1.5px 0;transform:rotate(45deg);transition:transform .25s;margin-inline:4px}
.cat[open]>summary .chv,.drow.ex .dtop .chv{transform:rotate(-135deg)}
.cat .cb{padding:0 12px 14px}
.cfld{padding:0 4px 6px}
.drow{margin-top:8px;border-radius:18px;background:#ffffff08;border:1px solid var(--line);transition:background .2s,border-color .2s}
.drow.ex{background:#ffffff0d;border-color:var(--line2)}
.drow.off .dtop .ph,.drow.off .dm{opacity:.5}
.dtop{display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer;border-radius:18px}
.dtop:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.dtop .ph{width:46px;height:46px;border-radius:12px;font-size:18px}
.dm{flex:1;min-width:0}
.dm b{display:block;font:500 14.5px/1.25 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm span{display:block;margin-top:2px;font-size:12.5px;color:var(--gold)}
.dm em{font-style:normal;color:var(--bad)}
.dtop .sw{margin:0;flex:none}
.dbody{display:none;padding:2px 14px 14px;border-top:1px solid var(--line)}
.drow.ex .dbody{display:block}
.drow.hide,.cat.hide{display:none}
.dbody .tools{margin-top:14px}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow .btn{margin:0}

/* settings */
.set{margin:12px 16px 0;padding:16px;border-radius:24px;border:1px solid var(--line);background:var(--card)}
.set h2{display:flex;align-items:center;gap:10px;font:500 24px var(--serif)}
.set h2 .ic{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#d3c9941f;color:var(--gold)}
.set h2 .ic svg{width:17px;height:17px}
.set .d{margin-top:6px;font-size:13px;color:var(--mut);line-height:1.6}
.set .fld:first-of-type{margin-top:14px}
.g1{display:grid;grid-template-columns:1fr;gap:0}
.pw{position:relative}
.pw input{padding-inline-end:70px;letter-spacing:.3em;font-size:16px}
.pw button{position:absolute;top:50%;inset-inline-end:10px;transform:translateY(-50%);padding:6px 10px;border-radius:99px;font-size:12px;color:var(--gold);border:1px solid var(--line2)}
.danger{border-color:rgba(229,154,143,.28)}
.btn svg{width:16px;height:16px;vertical-align:-3px;margin-inline-end:6px}

.skl2{margin:12px 16px 0;height:120px;border-radius:24px;background:linear-gradient(100deg,#ffffff0a 30%,#ffffff1c 50%,#ffffff0a 70%) 0 0/200% 100%;animation:kzsh 1.2s linear infinite}

@media(min-width:560px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){
 .grid2{display:block;column-count:2;column-gap:0}
 .grid2 .pnl{margin-inline:16px;break-inside:avoid}
 .kpis{grid-template-columns:repeat(6,1fr)}
 .page.wide .hero2,.page.wide .live{margin-inline:16px}
}
@media(prefers-reduced-motion:reduce){.spark i,.live .pd.on{transition:none;animation:none}}

/* table QR tab */
.tqg{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin:12px 16px 0}
.tqc{padding:12px;border-radius:22px 8px 22px 22px;background:var(--card);border:1px solid var(--line)}
.tqc canvas{display:block;width:100%;height:auto;border-radius:10px;background:#10211a}
.tqc .fld{margin-top:10px}.tqc .tools{margin-top:10px}
/* waiter + cancelled reports */
.pnl.full{grid-column:1/-1}
.wlist{display:grid;gap:14px;margin-top:10px}
.wr .wh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.wr .wh b{font:500 16px var(--sans)}.wr .wh span{color:var(--gold);font-size:14px}
.wr .tr{height:6px;border-radius:99px;background:#ffffff14;margin:7px 0 9px;overflow:hidden}.wr .tr i{display:block;height:100%;background:var(--gold);border-radius:99px}
.wm{display:flex;flex-wrap:wrap;gap:6px 18px}.wm span{font-size:12.5px;color:var(--mut)}.wm i{font-style:normal;font-weight:500;color:var(--cream);margin-inline-end:5px}.wm .bd i{color:var(--bad)}
.sub3{font:400 13px var(--sans);color:var(--mut);margin:12px 0 4px}
.cl{margin-top:12px;border-top:1px solid var(--line)}.cl>div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.cl b{font-weight:500}.cl span{color:var(--mut)}.cl i{font-style:normal;color:var(--gold)}
em.so{color:var(--bad);font-style:normal}
.btn.ghost.on{border-color:var(--bad);color:var(--bad)}
@media print{.tqg{display:none}}
</style>
</head>

  if(q){if(c==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
  else if(c==='"')q=true;else if(c===dl){row.push(cur);cur=""}
  else if(c==="\n"||c==="\r"){if(c==="\r"&&txt[i+1]==="\n")i++;row.push(cur);cur="";if(row.some(v=>v.trim()))rows.push(row);row=[]}

 items.forEach(o=>{const n=String(o.nen||o.nar||"").trim(),p=num(o.pr);if(!n||p==null){w.skip++;return}
  const ce=String(o.cen||o.car||"Menu").trim()||"Menu",ca=String(o.car||o.cen||"المنيو").trim(),key=ce.toLowerCase();
  if(!(key in idx)){idx[key]=cats.length;cats.push([ce,ca,[]])}
  if(!String(o.nar||"").trim())w.noAr++;
  cats[idx[key]][2].push([String(o.nen||o.nar).trim(),String(o.nar||o.nen).trim(),p,String(o.den||"").trim(),String(o.dar||o.den||"").trim(),"",0])});

  return build(j.map(o=>{const r={};Object.keys(o).forEach(k=>{const f=fieldOf(k);if(f)r[f]=o[k]});return r}))}
 const rows=parseTable(txt);if(rows.length<2)return null;const map=rows[0].map(fieldOf);if(!map.includes("pr")||!(map.includes("nen")||map.includes("nar")))return null;
 return build(rows.slice(1).map(r=>{const o={};map.forEach((f,i)=>{if(f&&o[f]==null)o[f]=r[i]});return o}))}

   <label class="fld"><span>${x.tLabel}</span><input data-tl="${esc(tb.id)}" maxlength="14" value="${esc(tb.label)}"${tqBad(tb.label,tb.id)?' class="bad"':""}></label>
   <div class="tools"><button class="btn sm" data-a="tqdl" data-id="${esc(tb.id)}">${x.dl}</button><button class="btn sm bad" data-a="tqdel" data-id="${esc(tb.id)}">${x.del}</button></div></div>`).join("")}</div>
  <p class="note">${x.qrNote}</p>`}

/* ---------- shell ---------- */
function head(){const x=t(),d=new Date(),g=d.getHours(),greet=g<5?x.gN:g<12?x.gM:g<17?x.gA:g<22?x.gE:x.gN;
 $("#sub").innerHTML=`${greet}. ${x.gSub}<span class="dt">${d.toLocaleDateString(locale(),{weekday:"long",day:"numeric",month:"long"})}</span>`}
function render(){const x=t(),ar=lang==="ar";
 document.documentElement.lang=lang;document.documentElement.dir=ar?"rtl":"ltr";
 $("#h1").textContent=x.h1;head();$("#lock").setAttribute("aria-label",x.lock);$("#back").setAttribute("aria-label",x.back);$("#lang").setAttribute("aria-label",x.langA);
 $("#tabs").innerHTML=[["reports","chart"],["menu","book"],["tables","qr"],["settings","sliders"]].map(([k,i])=>`<button role="tab" aria-selected="${tab===k}" class="${tab===k?"on":""}" data-tab="${k}">${ic(i)}<span>${x[k]}</span></button>`).join("");
 $("#view").innerHTML=`<div class="page${tab==="reports"?" wide":""}">`+(tab==="reports"?reports():tab==="menu"?menuView():tab==="tables"?tablesView():settingsView())+`</div>`;
 if(tab==="menu")filterMenu();if(tab==="tables")KZQR.paint($("#view"),TQ)}

function csvOrders(){const O=KZ.list("orders");if(!O.length){toast(t().noOrdersX,1);return}
 const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"',L=["date,time,table,status,items,subtotal,service,tax,total,note,waiter,reason"];
 O.forEach(o=>{const d=new Date(o.ts),pad2=n=>String(n).padStart(2,"0");
  L.push([`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`,`${pad2(d.getHours())}:${pad2(d.getMinutes())}`,o.table,o.status,(o.items||[]).map(i=>i.qty+"x "+i.en+(i.note?" ("+i.note+")":"")).join("; "),o.total||0,o.service||"",o.tax||"",o.grand||"",o.note||"",o.waiter?KZ.wname(o.waiter,"en"):"",KZ.reasonText(o,"en")].map(q).join(","))});
 dl("kanzel-orders.csv","﻿"+L.join("\n"),"text/csv;charset=utf-8")}
function dl(name,txt,type){const u=URL.createObjectURL(new Blob([txt],{type})),l=document.createElement("a");l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}

document.addEventListener("click",e=>{
 const tb=e.target.closest("[data-tab]");if(tb){tab=tb.dataset.tab;if(tab==="menu")raw=KZ.menuRaw();render();scrollTo(0,0);return}
 const rg=e.target.closest("[data-range]");if(rg){range=rg.dataset.range;render();return}
 const tg=e.target.closest("[data-toggle]");if(tg&&!e.target.closest("label.sw")){const r=tg.closest(".drow"),on=r.classList.toggle("ex");tg.setAttribute("aria-expanded",on);if(on)openD.add(r.dataset.key);else openD.delete(r.dataset.key);return}
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,ci=+b.dataset.ci,di=+b.dataset.di,x=t();
 const keep=(k)=>{open.add(ci);if(k!=null)openD.add(ci+"-"+k);saveMenu();render()};
 const clearD=()=>{openD.clear()};
 if(a==="imp"){imp.open=!imp.open;render();if(imp.open)impStatus();return}
 if(a==="impgo"){applyImport();return}
 if(a==="impexp"){imp.txt=toCsv();const ta=$("#impTxt");if(ta)ta.value=imp.txt;impStatus();return}
 if(a==="impdl"){dl("kanzel-menu.csv","﻿"+toCsv(),"text/csv;charset=utf-8");return}
 if(a==="tqprint"){if(TQ.some(t=>tqBad(t.label,t.id))){toast(x.dup,1);return}KZQR.ready.then(()=>KZQR.print(TQ));return}
 if(a==="tqdl"){const tb=TQ.find(t=>t.id===b.dataset.id);if(tb&&!tqBad(tb.label,tb.id))KZQR.ready.then(()=>KZQR.download(tb));else toast(x.dup,1);return}
 if(a==="tqdel"){arm(b,x.delSure,()=>{TQ=TQ.filter(t=>t.id!==b.dataset.id);if(!TQ.length)TQ=KZQR.defaults();KZQR.save(TQ);render()});return}
 if(a==="tqadd"){const nums=TQ.map(t=>parseInt(t.label,10)).filter(n=>!isNaN(n)),nx=nums.length?Math.max(...nums)+1:TQ.length+1;TQ.push({id:KZ.uid(),label:String(nx)});KZQR.save(TQ);render();scrollTo({top:document.body.scrollHeight,behavior:"smooth"});return}
 if(a==="showpin"){const i=b.parentElement.querySelector("input"),s=i.type==="password";i.type=s?"text":"password";i.style.letterSpacing=s?".3em":".3em";b.textContent=s?x.hide:x.show;return}
 if(a==="sold"){const d=raw[ci][2][di];KZ.setSold(d[0],!KZ.isSold(d[0]));open.add(ci);openD.add(ci+"-"+di);render();return}
 if(a==="dadd"){raw[ci][2].push([x.newDish,x.newDish,0,"","","",0]);clearD();keep(raw[ci][2].length-1)}
 else if(a==="ddel")arm(b,x.delSure,()=>{raw[ci][2].splice(di,1);clearD();keep()});
 else if(a==="dup"){move(raw[ci][2],di,di-1);clearD();keep(di-1)}else if(a==="ddn"){move(raw[ci][2],di,di+1);clearD();keep(di+1)}
 else if(a==="rmphoto"){raw[ci][2][di][5]="";keep(di)}
 else if(a==="cadd"){raw.push([x.newCat,x.newCat,[]]);open=new Set([raw.length-1]);clearD();saveMenu();render()}
 else if(a==="cdel")arm(b,x.delSure,()=>{raw.splice(ci,1);open=new Set();clearD();saveMenu();render()});
 else if(a==="cup"){move(raw,ci,ci-1);open=new Set([ci-1]);clearD();saveMenu();render()}else if(a==="cdn"){move(raw,ci,ci+1);open=new Set([ci+1]);clearD();saveMenu();render()}
 else if(a==="addw"){wsE.push({id:KZ.uid(),en:"",ar:""});render()}
  else if(a==="delw"){wsE.splice(+b.dataset.i,1);render()}
  else if(a==="savesettings"){const s=KZ.settings(),sp=$("#sStaff").value.trim(),ap=$("#sAdmin").value.trim();
  if(!/^\d{4}$/.test(sp)||!/^\d{4}$/.test(ap)){toast(x.pinBad,1);return}
  const mu=$("#sMaps").value.trim();if(mu&&!/^https?:\/\//i.test(mu)){toast(x.mapsBad,1);return}
  const wl=(wsE||[]).map(w=>({id:w.id,en:w.en.trim(),ar:w.ar.trim()}));if(!wl.length||wl.some(w=>!w.en&&!w.ar)){toast(x.wMin,1);return}
   s.waiters=wl;wsE=null;
   s.mapsUrl=$("#sMaps").value.trim()||s.mapsUrl;s.staffPin=sp;s.adminPin=ap;KZ.saveSettings(s);render();toast(x.saved)}
 else if(a==="reset")arm(b,x.resetSure,()=>{KZ.resetMenu();raw=null;toast(x.saved)});
 else if(a==="clear")arm(b,x.clearSure,()=>{["orders","bookings","events","calls"].forEach(n=>KZ.saveList(n,[]));toast(x.cleared)});
 else if(a==="exportO")csvOrders();
 else if(a==="export"){const o={exportedAt:new Date().toISOString(),menu:KZ.menuRaw(),settings:KZ.settings()};["orders","bookings","events","calls"].forEach(n=>o[n]=KZ.list(n));
  dl("kanzel-data.json",JSON.stringify(o,null,1),"application/json")}});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("[data-toggle]")){e.preventDefault();e.target.click()}});
document.addEventListener("toggle",e=>{const d=e.target;if(d.matches&&d.matches("details.cat")){const ci=+d.dataset.ci;if(d.open)open.add(ci);else open.delete(ci)}},true);
/* typing in the menu editor: update data without re-rendering so the keyboard stays open */
document.addEventListener("input",e=>{const el=e.target;
 if(el.id==="mSearch"){mq=el.value;filterMenu();return}
 const f=el.dataset&&el.dataset.f;if(!f||!raw)return;
 const ci=+el.dataset.ci,di=+el.dataset.di,k=f.slice(1);
 if(["c0","c1","d0","d1"].includes(f))el.classList.toggle("bad",!el.value.trim());
 if(f[0]==="c")raw[ci][+k]=el.value;
 else if(f==="d6"){raw[ci][2][di][6]=el.checked?0:1}
 else if(f==="d2")raw[ci][2][di][2]=Math.max(0,Number(el.value)||0);
 else raw[ci][2][di][+k]=el.value;
 if(f[0]==="d"&&["d0","d1","d2","d6"].includes(f)){const row=el.closest(".drow"),d=raw[ci][2][di];if(row){row.classList.toggle("off",!!d[6]);row.querySelector(".dm b").textContent=lang==="ar"?d[1]:d[0];row.querySelector(".dm span").innerHTML=metaOf(d);row.dataset.q=(d[0]+" "+d[1]).toLowerCase();const ph=row.querySelector(".dtop .ph");if(!d[5])ph.textContent=initial(d[0])}}
 if(f==="c0"||f==="c1"){const s=el.closest("details").querySelector("summary>span");if(s&&((f==="c1")===(lang==="ar")))s.textContent=el.value}
 saveMenu()});
document.addEventListener("change",e=>{const el=e.target;if(!el.matches("[data-photo]")||!el.files[0])return;
 const ci=+el.dataset.ci,di=+el.dataset.di;shrink(el.files[0],url=>{if(!url){toast(t().imgErr,1);return}raw[ci][2][di][5]=url;open.add(ci);openD.add(ci+"-"+di);saveMenu();render()})});
$("#lang").onclick=()=>{lang=lang==="ar"?"en":"ar";KZ.setLang(lang);render()};
$("#lock").onclick=()=>{KZ.logout("admin");location.reload()};
addEventListener("scroll",()=>{const n=$("#anav");if(n)n.classList.toggle("stuck",scrollY>120)},{passive:true});
setInterval(()=>{if(tab==="reports"&&!document.hidden&&!document.activeElement.matches("input,textarea"))render()},30000);
KZ.gate("admin").then(()=>{$("#app").hidden=false;render()});
</script>
