<style>
:root{--forest:#10211a;--moss:#2f5233;--gold:#d3c994;--cream:#f4efdd;
 --serif:"Cormorant Garamond","Readex Pro",Georgia,serif;--sans:"Readex Pro",system-ui,sans-serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--forest);color:var(--cream);font-family:var(--sans);font-weight:300;overflow-x:hidden;overflow-x:clip}
#homeView button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.ig:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.scene{position:relative;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3}
.bgl{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center;opacity:0;transition:opacity .6s}
.veil{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(16,33,26,.88),rgba(16,33,26,.55) 22%,rgba(16,33,26,.2) 42%,rgba(16,33,26,.6) 68%,rgba(16,33,26,.96))}
.top{display:flex;justify-content:flex-end;padding:16px 20px 0}
.lang{background:rgba(16,33,26,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(211,201,148,.55);color:var(--gold);border-radius:50%;width:40px;height:40px;padding:0;display:grid;place-items:center;transition:background .25s,transform .25s}
.lang svg{width:22px;height:22px;display:block}
.lang:hover{background:rgba(211,201,148,.18)}.lang:active{transform:scale(.94)}
.hero{text-align:center;padding:0 24px}
.hero img{width:min(40vw,200px);height:auto;display:block;margin:0 auto}
.tag{font:italic 500 clamp(19px,5vw,24px)/1.35 var(--serif);margin:8px 0 0;text-shadow:0 2px 18px rgba(0,0,0,.7),0 1px 3px rgba(0,0,0,.5)}
.sp{flex:1;min-height:3vh}
.rows{width:100%;max-width:520px;margin:0 auto;padding:0 26px 14px}
.w{display:block;font:500 clamp(42px,12vw,56px)/1.15 var(--serif)}
.s{display:block;font-size:13px;color:rgba(244,239,221,.8)}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;width:100%;padding:14px 0 16px;border:0;border-top:1px solid rgba(211,201,148,.55);background:none;text-align:start}
.row .ic{grid-row:1/3;grid-column:2}
.go{display:block;width:11px;height:11px;border:solid var(--gold);border-width:1.5px 1.5px 0 0;transform:rotate(45deg)}
[dir=rtl] .go{transform:rotate(-135deg)}
.pl{position:relative;display:block;width:16px;height:16px}
.pl::before,.pl::after{content:"";position:absolute;background:var(--gold);inset:7px 0 auto;height:1.5px;transition:transform .3s}
.pl::after{transform:rotate(90deg)}.open .pl::after{transform:none}
.sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s}.sub>div{overflow:hidden}.open+.sub{grid-template-rows:1fr}
.o{display:flex;align-items:center;gap:14px;width:100%;padding:10px 0;border:0;border-top:1px solid rgba(211,201,148,.25);background:none;text-align:start}
.o b{display:block;font:500 16px var(--sans)}
.o .s{font-size:12.5px}
.th{flex:none;width:44px;height:58px;border-radius:99px 99px 6px 6px;background-size:cover;background-position:center}
.foot{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:368px;margin:0 auto;padding:6px 14px 16px;font-size:12.5px}.fl{display:contents}.fl .pill{justify-content:center;padding:11px 8px;white-space:nowrap}.pill{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:99px;border:1px solid rgba(211,201,148,.45);background:rgba(16,33,26,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--gold);text-decoration:none;font-size:12.5px;line-height:1;transition:background .2s,transform .2s}.pill:hover{background:rgba(211,201,148,.18)}.pill:active{transform:scale(.96)}.pill:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.pill svg{width:16px;height:16px;flex:none}
.ig{color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(211,201,148,.5)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--cream);color:var(--forest);padding:12px 20px;border-radius:12px;font-size:14px;max-width:88vw;text-align:center;transition:.3s;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:820px){.hero img{width:240px}.rows{padding-bottom:22px}}

.wsheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}.wsheet[hidden]{display:none}
.wbd{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:wf .25s both}
.wpn{position:relative;width:100%;max-width:520px;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));background:#162b21;border-top:1px solid rgba(211,201,148,.5);border-radius:28px 28px 0 0;display:grid;gap:10px;animation:wu .35s cubic-bezier(.2,.7,.2,1) both}
.wpn h3{font:600 26px var(--serif);color:var(--cream)}.wpn p{font-size:14px;opacity:.9;margin-bottom:4px}
.wnum{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:99px;border:1px solid var(--gold);color:var(--gold);font:500 18px var(--sans);letter-spacing:.5px;text-decoration:none}
.wnum svg{width:22px;height:22px}.wnum:active{background:rgba(211,201,148,.16)}
.wx{padding:12px;color:var(--cream);opacity:.88;font:400 14px var(--sans);background:none;border:0}
@keyframes wf{from{opacity:0}}@keyframes wu{from{transform:translateY(100%)}}
@media(prefers-reduced-motion:reduce){.wbd,.wpn{animation:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}

#menuView{display:none;--top:0px}
#menuView *,#menuView *::before,#menuView *::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
#menuView{background:var(--forest);min-height:100dvh}
#menuView button,#menuView a{font:inherit;color:inherit;cursor:pointer;text-decoration:none}
#menuView button{background:none;border:0}
#menuView .wrap{max-width:600px;margin:0 auto}
#menuView .bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0}
#menuView .rnd{width:40px;height:40px;border-radius:50%;border:1px solid rgba(211,201,148,.55);color:var(--gold);display:grid;place-items:center;background:rgba(16,33,26,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font:500 13px var(--sans);transition:background .25s,transform .25s}
#menuView .rnd:hover{background:rgba(211,201,148,.18)}#menuView .rnd:active{transform:scale(.94)}
#menuView #mlang svg{width:22px;height:22px;display:block}
#menuView .rnd svg{width:18px;height:18px}
#menuView [dir=rtl] .back svg,[dir=rtl] #menuView .back svg{transform:scaleX(-1)}
#menuView .bar img{height:44px;width:auto}
#menuView .mh{padding:8px 20px 4px}
#menuView .mh h1{font:600 30px/1.05 var(--serif)}
#menuView .mh p{font-size:13px;opacity:.9;margin-top:4px}
#menuView nav button{flex:none;height:40px;border-radius:99px;padding:0 16px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border:1px solid #d3c99430}
#menuView nav button span,#menuView nav button small{display:none}
#menuView nav button b{font:500 13px var(--sans);white-space:nowrap}
#menuView .card{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:10px 12px;margin-bottom:8px;background:#ffffff0a;border-radius:18px}
#menuView .card.np{grid-template-columns:1fr;padding:12px 14px}
#menuView .card.np>div{display:grid;grid-template-columns:1fr auto;column-gap:14px;align-items:baseline}
#menuView .card.np p{grid-column:1/-1;grid-row:2}
#menuView .card.np .pr{grid-row:1;grid-column:2;margin:0}
#menuView .ph{height:78px;border-radius:14px;border:1px solid #d3c99440;background-size:cover;background-position:center;background-color:#2a4a2f}
#menuView .card h3{font:600 17px/1.25 var(--serif)}
#menuView .card p{font:400 13px/1.5 var(--sans);color:#e6e0cb;opacity:1;margin:3px 0 0}
#menuView .card p:empty{display:none}
#menuView .card .pr{display:block;margin-top:6px;padding:0;border:0;background:none;font:700 16px/1.2 var(--sans);color:#e8d98a;white-space:nowrap}
#menuView .card .pr small{font:500 12px var(--sans);opacity:.9;margin-inline-start:3px}
#menuView nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:10px;overflow-x:auto;padding:10px 16px;background:#10211af5;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);scrollbar-width:none}
#menuView nav button.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
#menuView section{padding:8px 16px 0;scroll-margin-top:84px}
#menuView h2{margin:0;font:inherit}
#menuView .acch{display:flex;align-items:center;gap:12px;width:100%;padding:16px 4px;text-align:start;border-bottom:1px solid rgba(211,201,148,.3)}
#menuView .acch .nm{flex:1;font:italic 600 28px/1.15 var(--serif);color:var(--gold)}
#menuView .acch small{font-size:13px;opacity:.88}
#menuView .acch .chev{flex:none;width:10px;height:10px;margin-inline:4px;border:solid var(--gold);border-width:0 1.5px 1.5px 0;transform:rotate(45deg) translate(-2px,-2px);transition:transform .3s}
#menuView section.open .chev{transform:rotate(-135deg) translate(-2px,-2px)}
#menuView .items{padding-top:12px}
#menuView section:not(.open) .items{display:none}
#menuView section.open .items{animation:fade .35s both}
#menuView .totop{position:fixed;inset-inline-end:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;width:48px;height:48px;border-radius:50%;border:1px solid var(--gold);background:#10211af2;color:var(--gold);display:grid;place-items:center;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#menuView .totop.on{opacity:1;transform:none;pointer-events:auto}
#menuView .totop svg{width:20px;height:20px}
[dir=rtl] #menuView .acch .nm,[dir=rtl] #menuView nav button b{font-style:normal}
#menuView .tax{font-size:13px;opacity:.85;text-align:center;padding:28px 20px calc(60px + env(safe-area-inset-bottom,0px))}
body.is-menu #homeView{display:none}
body.is-menu #menuView{display:block}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--forest);z-index:10}
html{scroll-behavior:auto}
:root{color-scheme:dark}
#homeView{transition:transform .8s cubic-bezier(.7,0,.2,1),opacity .8s}
body.leaving #homeView{transform:scale(.93);opacity:.45}
#menuView.reveal{display:block;position:fixed;inset:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);z-index:20;overflow:hidden;clip-path:circle(0 at var(--x) var(--y));animation:rev .8s cubic-bezier(.7,0,.2,1) forwards}
@keyframes rev{to{clip-path:circle(150vmax at var(--x) var(--y))}}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
#menuView.anim .bar{animation:fade .5s .25s ease both}
#menuView.anim .bar>*{animation:pop .65s .35s cubic-bezier(.3,1.4,.5,1) both}
#menuView.anim .bar>:nth-child(2){animation-delay:.43s}
#menuView.anim .bar>:nth-child(3){animation-delay:.51s}
#menuView.anim .mh{animation:up .6s .4s cubic-bezier(.2,.7,.2,1) both}
#menuView.anim nav{animation:fade .5s .5s ease both}
#menuView.anim nav button{animation:chip .55s calc(.55s + var(--c,0)*.05s) cubic-bezier(.2,.7,.2,1) both}
#menuView .mh h1::after{content:"";display:block;height:1.5px;width:56px;background:var(--gold);margin-top:10px;transform-origin:left}
[dir=rtl] #menuView .mh h1::after{transform-origin:right}
#menuView.anim .mh h1::after{animation:line .9s .75s cubic-bezier(.2,.7,.2,1) both}
#menuView.anim #mlist section:first-child h2{animation:up .6s .6s cubic-bezier(.2,.7,.2,1) both}
#menuView.anim .card{animation:up .65s calc(.7s + var(--i,0)*.08s) cubic-bezier(.2,.7,.2,1) both}
@keyframes mout{to{opacity:0;transform:translateY(46px) scale(.96)}}
#menuView.out{animation:mout .33s ease forwards}
@keyframes hin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
#homeView.homein{animation:hin .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes chip{from{opacity:0;transform:translateX(calc(34px*var(--dx,1))) scale(.9)}to{opacity:1;transform:none}}
@keyframes line{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
[dir=rtl] #menuView{--dx:-1}
.spin{animation:spin .8s cubic-bezier(.5,0,.2,1)}
#homeView .hero,#homeView .rows,#menuView .mh,#menuView #mlist,#menuView nav{transition:transform .5s cubic-bezier(.2,.7,.2,1),opacity .3s}
body.lswap #homeView .hero,body.lswap #homeView .rows,body.lswap #menuView .mh,body.lswap #menuView #mlist,body.lswap #menuView nav{opacity:0;transform:translateY(10px)}
body.leaving #homeView .hero{transform:translateY(-28px);opacity:0}
body.leaving #homeView .rows{transform:translateY(28px);opacity:0}
#ring{position:fixed;width:0;height:0;border-radius:50%;border:1.5px solid var(--gold);transform:translate(-50%,-50%);z-index:30;pointer-events:none;animation:ringgo .8s cubic-bezier(.7,0,.2,1) forwards}
@keyframes ringgo{0%{width:0;height:0;opacity:1}75%{opacity:1}100%{width:300vmax;height:300vmax;opacity:0}}
@media(prefers-reduced-motion:reduce){#menuView *,#homeView,.spin,#ring{animation:none!important}}
.emptyM{padding:48px 24px;text-align:center;color:var(--cream)}
</style>
</head>
